<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <div class="title-row">
        <div>
          <p class="eyebrow">TODAY'S FOCUS</p>
          <h1>待辦清單</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"></button>
      </div>
      <p class="subtitle">把想完成的事，一件一件放進今天。</p>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input id="todo-input" name="todo" type="text" placeholder="接下來要完成什麼？" autocomplete="off" maxlength="120">
      <button type="submit">新增</button>
    </form>

    <div class="filter-bar" role="group" aria-label="篩選待辦事項">
      <button class="filter-button active" type="button" data-filter="all">全部</button>
      <button class="filter-button" type="button" data-filter="active">未完成</button>
      <button class="filter-button" type="button" data-filter="completed">已完成</button>
    </div>

    <section aria-label="待辦事項">
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-message" id="empty-message">還沒有任何待辦事項,新增一個吧!</p>
    </section>

    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button class="clear-completed-button" id="clear-completed" type="button" aria-label="清除所有已完成的待辦事項">
        清除已完成
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
